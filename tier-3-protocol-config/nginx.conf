worker_processes auto;

http {
  server {
    listen 443 ssl;
    server_name app.vuln-by-design.test;

    # Weak: TLS 1.0/1.1 enabled alongside 1.2.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Weak-ish cipher list (includes a non-PFS/legacy suite on purpose).
    ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:AES256-SHA";

    ssl_ecdh_curve X25519:prime256v1;

    ssl_certificate     /etc/nginx/certs/leaf_cert.pem;
    ssl_certificate_key /etc/nginx/certs/leaf_key.pem;
  }

  server {
    listen 8443 ssl;
    server_name strong.vuln-by-design.test;

    # Strong: TLS 1.3 only.
    ssl_protocols TLSv1.3;
    ssl_ciphers "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256";
  }
}
