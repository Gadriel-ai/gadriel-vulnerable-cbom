<VirtualHost *:443>
    ServerName legacy.vuln-by-design.test

    # Weak: TLS 1.0/1.1 explicitly re-enabled alongside 1.2/1.3 -- the
    # opposite of Apache's own hardening guidance -- to exercise the
    # "legacy protocol recorded, not filtered" path.
    SSLProtocol -all +TLSv1 +TLSv1.1 +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5

    SSLCertificateFile    /etc/apache2/certs/leaf_cert.pem
    SSLCertificateKeyFile /etc/apache2/certs/leaf_key.pem
</VirtualHost>

<VirtualHost *:8443>
    ServerName strong.vuln-by-design.test
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
</VirtualHost>
